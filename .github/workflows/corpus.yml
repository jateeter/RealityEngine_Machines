# Corpus validation — deliberately minimal.
#
# This lane exists to force the local validation, not to stand in for it.
# `RealityEngine_CI/docs/ENGINEERING_CONTRACT.md` is authoritative: peripheral
# repositories keep repo-specific CI small, and a fix is fully verified by the
# _CI repo against a live universe.
#
# So this runs cheap, checkout-local gates and nothing else. It does NOT check
# out sibling repositories, install heavy toolchains, or approximate a universe
# — that work belongs in _CI, and a lane that needs three sibling checkouts to
# mean anything has outgrown its remit.
#
# This file previously did all three. It checked out RealityEngine_CI,
# localAIStack and localOpenClawStack, and installed ROBOT + Temurin to run the
# OWL reasoner. That was added for a real reason — without the siblings the
# cesgen registry check degrades to "12 scopes" instead of 16 and
# prove-workflows evaluates 0 agents — but it was the wrong fix in the wrong
# repository. The answer to "this lane cannot see enough to be meaningful" is to
# let _CI verify it, not to rebuild a workspace here.
#
# WHAT THIS DOES NOT COVER
# ------------------------
# Named rather than left silent, because a SKIP scrolling past in a green log is
# how an unwired check goes unnoticed — the failure this repo has already paid
# for twice (#115, #158). None of the following runs here; all of it belongs to
# _CI's regression lanes:
#
#   cesgen registry, full        needs RealityEngine_CI checked out alongside
#                                (corpus scopes + contract shards). Degrades to
#                                the corpus half, which still fails on drift.
#   prove-workflows R3/R4        needs localOpenClawStack's agent index
#   regression corpus scope      needs localAIStack's three machines
#   reason-owl / OWL reasoning   needs ROBOT + a JVM
#   validate-guardrails          needs pyshacl
#   extract-qudt-subset          needs rdflib + the gitignored .qudt-cache
#
# A green run here means the corpus is internally consistent and its derived
# artifacts are current, as far as a lone checkout can tell. It is not evidence
# that a change works, and must never be presented as such.

name: corpus

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Corpus validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: '25'
          cache: npm

      # ajv + ajv-formats back validate-schemas.mjs, the last stage of
      # validate-corpus.sh. Without node_modules that stage prints SKIPPED and
      # the schema check silently does not happen.
      - name: Install node dependencies
        run: npm ci

      # The audit scripts are stdlib-only; jsonschema is what the contract suite
      # needs. Nothing heavier is installed here on purpose — see the header.
      - name: Install python dependencies
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate corpus
        run: npm run validate

      # `npm run test:contracts` is already `unittest discover` — the same
      # invocation run-all-tests.sh uses. -v names every test and every skip
      # reason, so "which tests did this environment not run?" is answerable
      # from the log rather than by inference.
      - name: Contract suite
        run: npm run test:contracts -- -v

      - name: Report what this lane cannot check
        if: always()
        run: |
          echo "::notice title=Verified in _CI, not here::cesgen registry (full), prove-workflows R3/R4, regression corpus scope, OWL reasoning, validate-guardrails, extract-qudt-subset. This lane is checkout-local by design; RealityEngine_CI verifies the rest against a live universe."
